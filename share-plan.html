<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a plan on Drop</title>
  <meta name="description" content="Open a private plan invitation on Drop — the EDM show discovery app." />
  <meta name="theme-color" content="#0B0D12" />
  <meta name="robots" content="noindex" />

  <meta property="og:title" content="Join a plan on Drop" />
  <meta property="og:description" content="Open a private plan invitation on Drop." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://trydropapp.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@trydropapp" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <link rel="stylesheet" href="/shell.css" />
</head>
<body>
  <main class="share-wrap">
    <div class="share-glow" style="width:520px; height:520px; background:radial-gradient(circle,rgba(226,77,255,0.28),transparent 62%); top:-180px; right:-80px;"></div>
    <div style="position:relative; width:100%; max-width:440px;">
      <a class="share-mark" href="/index.html"><span class="droplet" aria-hidden="true"></span>DROP</a>

      <div class="share-card">
        <div class="share-card__media" style="background:linear-gradient(160deg,#2b1c4d,#0d3b52 55%,#143a22);">
          <div class="wsc__scrim"></div>
          <span class="share-card__pill">PRIVATE PLAN</span>
          <div class="share-card__text">
            <div class="wsc__date">PLAN INVITATION</div>
            <div style="font-family:var(--font-display); font-weight:700; font-size:var(--fs-xl); letter-spacing:var(--tr-snug); line-height:1.1; color:var(--text);">Make the night happen</div>
            <div style="color:var(--text-secondary); font-size:var(--fs-sm);">Sign in to view details shared with you.</div>
          </div>
        </div>
        <div class="share-card__body">
          <div style="font-family:var(--font-display); font-weight:700; font-size:var(--fs-lg); margin-bottom:var(--sp-md);">You received a Drop plan invitation</div>
          <a class="btn btn--primary btn--block" id="plan-join" href="https://app.trydropapp.com/?mode=login">Join on Drop — it's free</a>
          <a class="btn btn--ghost btn--block" style="margin-top:var(--sp-sm);" href="/download.html">Get the app</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/data.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      var sources = new Set(['creator','crew_invite','event_invite','event_share','friend_invite','invite_screen','plan_share','qr','recap_share','seen_history','show_memories','wrapped']);
      var match = location.pathname.match(/^\/plan\/([0-9a-f-]{36})(?:\/|$)/i);
      var planId = match && uuid.test(match[1]) ? match[1].toLowerCase() : '';
      var ref = uuid.test(p.get('ref') || '') ? p.get('ref').toLowerCase() : '';
      var source = sources.has(p.get('src')) ? p.get('src') : '';
      var signup = new URL('https://app.trydropapp.com/?mode=signup');
      if (ref && planId) {
        signup.searchParams.set('ref', ref);
        if (source) signup.searchParams.set('src', source);
        signup.searchParams.set('kind', 'plan');
        signup.searchParams.set('target', planId);
      }
      document.getElementById('plan-join').href = signup.toString();
    })();
  </script>
</body>
</html>
